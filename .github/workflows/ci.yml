name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen reference environment
        run: python -m pip install -r requirements.lock.txt
      - name: Install package without dependency resolution
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Lock parity
        run: python scripts/check_lock.py
      - name: Ruff
        run: ruff check src tests tools scripts
      - name: Unit and contract tests
        run: pytest -m 'not integration' -q
      - name: Validate tutorial and model-card source
        run: python tools/validate_release_assets.py
      - name: Standalone notebook parity (NOTEBOOK_SPEC 2.0 PAR3)
        run: python tools/build_notebook.py --check

  integration:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUN_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore the staged checkpoints
        uses: actions/cache@v4
        with:
          path: |
            weights/lightglue-aliked/*.pth
            weights/lightglue-aliked/*.safetensors
          key: lightglue-aliked-${{ runner.os }}-v1
      - name: Install frozen reference environment
        run: python -m pip install -r requirements.lock.txt
      - name: Install package without dependency resolution
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Lock parity
        run: python scripts/check_lock.py
      - name: Real pinned checkpoint smoke test
        run: pytest -m integration -q
      # The notebook is standalone (NOTEBOOK_SPEC 2.0 §4): it carries the package and pins its own
      # runtime. DIMER_NOTEBOOK_CI_PREINSTALLED=1 skips the inline pip install so the frozen CPU
      # reference environment above stays the runtime; the notebook stages the weights itself into
      # weights/lightglue-aliked/ (the committed manifest is already there) and converts them.
      - name: Execute live tutorial top-to-bottom
        env:
          DIMER_NOTEBOOK_CI_PREINSTALLED: '1'
        run: python tools/run_notebook.py tutorials/lightglue_matching_colab.ipynb
      - name: Upload tutorial outputs
        uses: actions/upload-artifact@v4
        with:
          name: lightglue-live-tutorial-outputs
          path: outputs/
